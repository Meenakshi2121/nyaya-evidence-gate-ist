[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya-evidence-gate-ist"
version = "0.1.0"
description = "Reproducible analysis of a Nyaya-inspired evidence gate in IST"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

