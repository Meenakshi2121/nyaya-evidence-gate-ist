[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya-evidence-gate-ist"
version = "0.1.0"
description = "Reproducible analysis of a Nyaya-inspired evidence gate in IST"
requires-python = ">=3.11"

dependencies = [
  "econml==0.17.0",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.8,<1.10",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

